name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every build gets its own version (major.minor from package.json, patch = run
      # number) so a newer download always upgrades the installed package.
      - name: Stamp build version
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}"
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: devbox-client-deb
          path: dist/*.deb

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every build gets its own version (major.minor from package.json, patch = run
      # number) so a newer download always upgrades the installed package.
      - name: Stamp build version
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}"
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: devbox-client-windows-installer
          path: dist/*.exe
